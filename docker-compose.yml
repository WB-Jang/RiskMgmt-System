services:
  oracle-db:
    image: gvenzl/oracle-xe:21.3.0
    container_name: oracle-db
    ports:
      - "1521:1521"
      - "5500:5500"
    environment:
      ORACLE_PASSWORD: your_password   # 여기에 오라클 DB의 SYS/SYSTEM 계정 비밀번호를 설정
      ORACLE_PWD: your_password        # 일부 이미지에서 사용 (둘 다 넣어두면 안전)
      ORACLE_USER: your_username       # (옵션) 기본 사용자명, 미설정 시 ORACLE_PASSWORD로만 접근 가능
    volumes:
      - oracle-data:/opt/oracle/oradata

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

  api:
    build: ./api
    container_name: risk-api
    ports:
      - "8000:8000"
    depends_on:
      - kafka
      - oracle-db
    env_file:
      - ./.env
    environment:
      - KAFKA_BROKER=localhost:9092
      - ORACLE_DB=oracle-db:1521

  producer:
    image: python:3.9-slim
    container_name: oracle-cdc-producer
    working_dir: /app
    volumes:
      - ./:/app:cached
    depends_on:
      - kafka
      - oracle-db
    env_file:
      - ./.env
    # Install requirements on startup but do NOT auto-run the producer; keep container running for manual exec
    command: /bin/sh -c "pip install --no-cache-dir -r requirements.txt && tail -f /dev/null"

volumes:
  oracle-data:
